[project]
name = "drone-search-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent find an object from the air with a (simulated) drone"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.12",
    "pymavlink>=2.4.41",
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "pydantic>=2",
    "structlog>=24",
    "shapely>=2",
    "torch>=2.3",
    "transformers>=4.44",
]

[project.optional-dependencies]
eval = ["anthropic>=0.40", "mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9", "mypy>=1.10"]

[project.scripts]
drone-search-mcp = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "backends", "vision", "common"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["sim/generated", "scenarios/runs", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["server", "backends", "vision", "common", "sim", "scenarios", "eval"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["sim/generated", "sim/frame_grabber.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sitl: needs the simulator running (scripts/sim_up.sh)", "slow: loads vision models"]
addopts = "-m 'not sitl'"
