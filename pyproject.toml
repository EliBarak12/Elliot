[tool.uv.workspace]
members = [
    "packages/core",
    "packages/mcp-plugin",
    "packages/connector-runtime",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.10",
    "respx>=0.21",
    "types-psycopg2>=2.9",
    "types-pyyaml>=6.0.12.20260510",
    "slowapi>=0.1.9",
    "honcho>=2.0",
    # E2E suite (tests/e2e) — runs Studio in a headless browser. Not exercised
    # by the mandatory pre-push pytest run; opt-in via `make e2e`. Pinned to
    # 1.56.x so it matches the browser build cached at /opt/pw-browsers.
    "playwright>=1.56,<1.57",
    "pytest-playwright>=0.5",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["elliot_core", "elliot_mcp_plugin", "elliot_connector_runtime"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_return_any = false

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --tb=short"
markers = [
    "e2e: end-to-end tests requiring live services (deselect with '-m not e2e')",
    "integration: integration tests (deselect with '-m not integration')",
]
testpaths = [
    "packages/core/tests",
    "packages/mcp-plugin/tests",
    "packages/connector-runtime/tests",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = [
    "packages/core/src",
    "packages/mcp-plugin/src",
    "packages/connector-runtime/src",
]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
