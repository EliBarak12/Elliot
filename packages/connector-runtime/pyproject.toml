[project]
name = "elliot-connector-runtime"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "elliot-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jmespath>=1.0",
    "mcp>=1.3",
    "slowapi>=0.1.9",
    "uvicorn>=0.29",
]

[tool.uv.sources]
elliot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elliot_connector_runtime"]
