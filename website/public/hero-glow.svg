<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Elliot hero">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5646e"/>
      <stop offset="100%" stop-color="#8f1f29"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0303c" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#c0303c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c0303c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Soft outer glow -->
  <circle cx="180" cy="180" r="160" fill="url(#glow)"/>

  <!-- Orbiting rings -->
  <g fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.7">
    <ellipse cx="180" cy="180" rx="140" ry="58" transform="rotate(-18 180 180)"/>
    <ellipse cx="180" cy="180" rx="140" ry="58" transform="rotate(18 180 180)"/>
    <ellipse cx="180" cy="180" rx="140" ry="58" transform="rotate(90 180 180)"/>
  </g>

  <!-- Center mark -->
  <g>
    <rect x="118" y="118" width="124" height="124" rx="28" fill="url(#ring)"/>
    <rect x="118" y="118" width="124" height="124" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M148 144h60v12h-44v14h36v12h-36v14h46v12h-62z" fill="#ffffff"/>
  </g>

  <!-- Orbit nodes -->
  <g>
    <circle cx="40"  cy="180" r="9"  fill="#ffffff" stroke="url(#ring)" stroke-width="2.5"/>
    <circle cx="320" cy="180" r="9"  fill="#ffffff" stroke="url(#ring)" stroke-width="2.5"/>
    <circle cx="262" cy="58"  r="7"  fill="#ffffff" stroke="url(#ring)" stroke-width="2.5"/>
    <circle cx="98"  cy="302" r="7"  fill="#ffffff" stroke="url(#ring)" stroke-width="2.5"/>
    <circle cx="98"  cy="58"  r="6"  fill="#ffffff" stroke="url(#ring)" stroke-width="2.5"/>
    <circle cx="262" cy="302" r="6"  fill="#ffffff" stroke="url(#ring)" stroke-width="2.5"/>
  </g>
</svg>
