[project]
name = "elliot-mcp-plugin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "elliot-core",
    "mcp>=1.0",
]

[tool.uv.sources]
elliot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elliot_mcp_plugin"]

[project.scripts]
elliot-mcp = "elliot_mcp_plugin.cli:main"
