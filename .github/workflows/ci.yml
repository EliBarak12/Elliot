name: CI

on:
  push:
    branches: ["main", "epic/*", "claude/*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check packages/

      - name: Type check
        run: uv run mypy packages/core/src packages/mcp-plugin/src
        continue-on-error: true

      - name: Test
        run: |
          uv run pytest packages/core/tests/ packages/mcp-plugin/tests/ \
            -v --tb=short --no-header
