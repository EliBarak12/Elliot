<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Elliot — AX platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5646e"/>
      <stop offset="100%" stop-color="#8f1f29"/>
    </linearGradient>
    <radialGradient id="halo" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#c0303c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c0303c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630"/>
  </g>

  <!-- Mark -->
  <g transform="translate(80,160)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#brand)"/>
    <path d="M30 26h60v12H46v14h36v12H46v14h46v12H30z" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="244" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif"
        font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-3">Elliot</text>

  <!-- Tagline -->
  <text x="80" y="380" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif"
        font-size="48" font-weight="600" fill="#ffffff" letter-spacing="-2">Build your connector.</text>
  <text x="80" y="432" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif"
        font-size="48" font-weight="600" fill="#ffffff" letter-spacing="-2">Make your product agent-ready.</text>
  <text x="80" y="486" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif"
        font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.72" letter-spacing="-0.5">
    Turn any API or database into an agent-ready connector.
  </text>

  <!-- URL chip -->
  <g transform="translate(80,540)">
    <rect x="0" y="0" width="280" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#c0303c" stroke-opacity="0.4"/>
    <circle cx="22" cy="22" r="6" fill="#c0303c"/>
    <text x="42" y="29" font-family="ui-monospace,SF Mono,Menlo" font-size="16" fill="#ffffff" fill-opacity="0.92">
      elibarak12.github.io/Elliot
    </text>
  </g>
