[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elliot-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "jmespath>=1.0",
    "cryptography>=42.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "fastapi>=0.115",
    "pyyaml>=6.0",
    # The MCP SDK is a core dependency (not just the two servers'): all SDK
    # contact — server construction, transports, client identity across the
    # 2025 handshake and 2026 stateless paths — is concentrated in
    # elliot_core.mcp_compat so an SDK bump is a one-module change.
    "mcp>=2.0.0,<3",
    # Real tokenizer for the canonical token estimate (elliot_core.tokens) — the
    # signature metric must be counted the same way in evals, traces, and the
    # dashboard. Lazy-imported with a chars/4 fallback, so it degrades gracefully.
    "tiktoken>=0.7",
]

[project.scripts]
elliot = "elliot_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elliot_core"]
# Hatchling's default wheel inclusion drops the non-Python connector templates
# under elliot_core/templates/, so a wheel-installed core (e.g. Elliot Cloud,
# which pip-installs this package from git) shipped without them — and the MCP
# resource layer served zero connector templates while the server instructions
# still advertised them. Force-include the directory so the templates travel
# with the wheel as package data.
artifacts = ["src/elliot_core/templates/*.json"]
