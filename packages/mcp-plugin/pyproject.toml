[project]
name = "elliot-mcp-plugin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "elliot-core",
    # Capped below 2.0: the SDK's 2.0 release drops `mcp.server.fastmcp`
    # (FastMCP became MCPServer under `mcp.server.mcpserver`), which every
    # server in this repo imports. Unbounded, a fresh install resolves to
    # 2.0 and fails at import. Lift the cap with a deliberate migration.
    "mcp>=1.0,<2",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[tool.uv.sources]
elliot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elliot_mcp_plugin"]

# Bundle the repo-root `skills/` (the single source of truth, shared with the
# .claude-plugin / .codex-plugin loaders) into the wheel as package data. Those
# files live OUTSIDE this package's `src/`, so a normal build leaves them out —
# which is why an installed-from-git plugin (e.g. Elliot Cloud, which installs
# this subdirectory) served an empty prompts list. `_find_skills_dir` looks for
# this bundled copy when the source-checkout layout isn't present.
[tool.hatch.build.targets.wheel.force-include]
"../../skills" = "elliot_mcp_plugin/_bundled_skills"

[project.scripts]
elliot-mcp = "elliot_mcp_plugin.cli:main"
