[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elliot-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "jmespath>=1.0",
    "cryptography>=42.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "asyncpg>=0.29",
    "structlog>=24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elliot_core"]
